version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * 1"
    ignore:
      # Remove once eslint-plugin-react supports ESLint 10
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "@eslint/json"
        versions: [">=1.2"]
      # Remove once typescript-eslint supports TypeScript 6
      - dependency-name: "typescript"
        versions: [">=6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
